{
  "name": "lcd301-grupoa",
  "services": {
    "prepare": {
      "image": "lcd301-grupoa-pipeline:4.0.1",
      "build": {"context": ".", "dockerfile": "Dockerfile.pipeline"},
      "entrypoint": ["python", "/opt/deploy/prepare.py"],
      "restart": "no",
      "volumes": ["../..:/source:ro", "project:/project", "data:/project/data", "evidence:/project/03_Visualizaciones/evidencias"]
    },
    "postgres": {
      "image": "${POSTGRES_IMAGE:-postgres:17.11-bookworm}",
      "restart": "unless-stopped",
      "environment": {"POSTGRES_USER": "${POSTGRES_USER:-lcd301}", "POSTGRES_DB": "${POSTGRES_DB:-lcd301}", "POSTGRES_PASSWORD": "${POSTGRES_PASSWORD:?Definir POSTGRES_PASSWORD en .env}"},
      "ports": ["127.0.0.1:55432:5432"],
      "volumes": ["postgres:/var/lib/postgresql/data", "../sql/00_schema.sql:/docker-entrypoint-initdb.d/10_schema.sql:ro"],
      "healthcheck": {"test": ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U $${POSTGRES_USER} -d $${POSTGRES_DB}"], "interval": "10s", "timeout": "5s", "retries": 30, "start_period": "30s"}
    },
    "api": {
      "image": "lcd301-grupoa-api:1.0.0",
      "build": {"context": ".", "dockerfile": "Dockerfile.python", "args": {"REQUIREMENTS_FILE": "requirements-api.txt"}},
      "entrypoint": ["python", "/opt/deploy/start_service.py", "api"],
      "restart": "unless-stopped",
      "environment": {"PROJECT_ROOT": "/project", "SOURCE_DATA_DIR": "/project/data/source", "API_RATE_PER_MINUTE": "120", "PGHOST": "postgres", "PGPORT": "5432", "PGDATABASE": "${POSTGRES_DB:-lcd301}", "PGUSER": "${POSTGRES_USER:-lcd301}", "PGPASSWORD": "${POSTGRES_PASSWORD:?Definir POSTGRES_PASSWORD en .env}"},
      "ports": ["127.0.0.1:18080:18080"],
      "volumes": ["project:/project:ro", "data:/project/data:ro"],
      "depends_on": {"prepare": {"condition": "service_completed_successfully"}, "postgres": {"condition": "service_healthy"}},
      "healthcheck": {"test": ["CMD", "python", "-c", "import json,urllib.request; d=json.load(urllib.request.urlopen('http://127.0.0.1:18080/health',timeout=3)); assert d['source_available']"], "interval": "10s", "timeout": "5s", "retries": 30, "start_period": "15s"}
    },
    "nifi": {
      "image": "apache/nifi:2.12.0",
      "restart": "unless-stopped",
      "environment": {"NIFI_WEB_HTTPS_HOST": "0.0.0.0", "NIFI_WEB_HTTPS_PORT": "8443", "NIFI_WEB_PROXY_HOST": "nifi:8443,localhost:8443,127.0.0.1:8443", "SINGLE_USER_CREDENTIALS_USERNAME": "${NIFI_USERNAME:-grupo_a}", "SINGLE_USER_CREDENTIALS_PASSWORD": "${NIFI_PASSWORD:?Definir NIFI_PASSWORD de al menos 12 caracteres}", "NIFI_JVM_HEAP_INIT": "512m", "NIFI_JVM_HEAP_MAX": "1g"},
      "ports": ["127.0.0.1:8443:8443"],
      "volumes": ["project:/project:ro", "data:/project/data", "nifi_conf:/opt/nifi/nifi-current/conf", "nifi_content:/opt/nifi/nifi-current/content_repository", "nifi_flowfiles:/opt/nifi/nifi-current/flowfile_repository", "nifi_provenance:/opt/nifi/nifi-current/provenance_repository", "nifi_state:/opt/nifi/nifi-current/state", "nifi_database:/opt/nifi/nifi-current/database_repository"],
      "depends_on": {"prepare": {"condition": "service_completed_successfully"}},
      "stop_grace_period": "60s",
      "healthcheck": {"test": ["CMD-SHELL", "curl --insecure --silent --fail https://localhost:8443/nifi-api/access/config > /dev/null"], "interval": "10s", "timeout": "5s", "retries": 90, "start_period": "120s"}
    },
    "dashboard": {
      "image": "lcd301-grupoa-dashboard:1.0.0",
      "build": {"context": ".", "dockerfile": "Dockerfile.python", "args": {"REQUIREMENTS_FILE": "requirements-dashboard.txt"}},
      "entrypoint": ["python", "/opt/deploy/start_service.py", "dashboard"],
      "restart": "unless-stopped",
      "environment": {"DASH_HOST": "0.0.0.0", "DASH_PORT": "8050", "PGHOST": "postgres", "PGPORT": "5432", "PGDATABASE": "${POSTGRES_DB:-lcd301}", "PGUSER": "${POSTGRES_USER:-lcd301}", "PGPASSWORD": "${POSTGRES_PASSWORD:?Definir POSTGRES_PASSWORD en .env}"},
      "ports": ["127.0.0.1:18050:8050"],
      "volumes": ["project:/project"],
      "depends_on": {"prepare": {"condition": "service_completed_successfully"}, "postgres": {"condition": "service_healthy"}},
      "healthcheck": {"test": ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8050/health',timeout=4)"], "interval": "15s", "timeout": "6s", "retries": 30, "start_period": "30s"}
    },
    "pipeline": {
      "image": "lcd301-grupoa-pipeline:4.0.1",
      "build": {"context": ".", "dockerfile": "Dockerfile.pipeline"},
      "profiles": ["batch"],
      "init": true,
      "entrypoint": ["python", "/opt/deploy/run_batch.py"],
      "command": ["--batch-id", "base"],
      "restart": "no",
      "environment": {"PROJECT_ROOT": "/project", "DATA_ROOT": "/project/data", "API_URL": "http://api:18080", "NIFI_URL": "https://nifi:8443/nifi-api", "NIFI_VERIFY_TLS": "false", "NIFI_ALLOW_INSECURE_HOST": "nifi", "NIFI_USERNAME": "${NIFI_USERNAME:-grupo_a}", "NIFI_PASSWORD": "${NIFI_PASSWORD:?Definir NIFI_PASSWORD en .env}", "PGHOST": "postgres", "PGPORT": "5432", "PGDATABASE": "${POSTGRES_DB:-lcd301}", "PGUSER": "${POSTGRES_USER:-lcd301}", "PGPASSWORD": "${POSTGRES_PASSWORD:?Definir POSTGRES_PASSWORD en .env}", "SPARK_LOCAL_IP": "127.0.0.1", "PYSPARK_PYTHON": "/usr/local/bin/python", "PYTHONUNBUFFERED": "1"},
      "volumes": ["project:/project", "data:/project/data", "evidence:/project/03_Visualizaciones/evidencias"],
      "depends_on": {"prepare": {"condition": "service_completed_successfully"}, "postgres": {"condition": "service_healthy"}, "api": {"condition": "service_healthy"}, "nifi": {"condition": "service_healthy"}}
    }
  },
  "volumes": {"project": {}, "data": {}, "evidence": {}, "postgres": {}, "nifi_conf": {}, "nifi_content": {}, "nifi_flowfiles": {}, "nifi_provenance": {}, "nifi_state": {}, "nifi_database": {}}
}
